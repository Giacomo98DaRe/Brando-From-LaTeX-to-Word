name: Tests and native packages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            executable: dist/Brando/Brando.exe
          - os: macos-15
            executable: dist/Brando.app/Contents/MacOS/Brando
          - os: macos-15-intel
            executable: dist/Brando.app/Contents/MacOS/Brando
          - os: ubuntu-24.04
            executable: dist/Brando/Brando
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Bootstrap pip only. uv supplies the exact project interpreter below;
          # security-only CPython releases lack Windows/macOS setup-python builds.
          python-version: '3.12.10'
      - name: Install pinned environment manager
        run: python -m pip install uv==0.13.7
      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0 xvfb xauth
      - name: Create independent locked development environment
        run: uv sync --frozen --extra dev --python 3.12.16 --managed-python
      - name: Run synthetic regressions only
        run: uv run --frozen --extra dev pytest -q
      - name: Check maintained Python quality
        run: |
          uv run --frozen --extra dev ruff check src tests scripts
          uv run --frozen --extra dev ruff format --check src tests scripts
      - name: Build native package
        run: uv run --frozen --extra dev python scripts/build.py
      - name: Exercise packaged runtime
        run: uv run --frozen --extra dev python scripts/smoke_package.py '${{ matrix.executable }}'
      - name: Check Linux desktop platform startup
        if: runner.os == 'Linux'
        run: xvfb-run -a env QT_QPA_PLATFORM=xcb BRANDO_UI_SMOKE_DIR=build/linux-desktop-smoke dist/Brando/Brando --ui-smoke
      - name: Save verified native package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Brando-${{ matrix.os }}
          path: |
            dist/Brando-*.zip
            dist/Brando-*.tar.gz
            dist/Brando-*.sha256
          retention-days: 7
