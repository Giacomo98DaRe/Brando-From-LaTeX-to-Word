name: Synthetic tests and native development builds

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            executable: dist/Brando/Brando.exe
          - os: macos-15
            executable: dist/Brando.app/Contents/MacOS/Brando
          - os: ubuntu-24.04
            executable: dist/Brando/Brando
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.16'
      - name: Install pinned environment manager
        run: python -m pip install uv==0.13.7
      - name: Create independent locked development environment
        run: uv sync --frozen --extra dev
      - name: Run synthetic regressions only
        run: uv run --frozen --extra dev pytest -q
      - name: Check maintained Python quality
        run: |
          uv run --frozen --extra dev ruff check src tests scripts
          uv run --frozen --extra dev ruff format --check src tests scripts
      - name: Build reviewable development package
        run: uv run --frozen --extra dev python scripts/build.py
      - name: Exercise packaged runtime
        run: uv run --frozen --extra dev python scripts/smoke_package.py '${{ matrix.executable }}'
      - name: Save development artifacts (never publish a release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Brando-development-${{ matrix.os }}
          path: |
            dist/Brando-*.zip
            dist/Brando-*.tar.gz
            dist/Brando-*.sha256
          retention-days: 7
