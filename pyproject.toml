[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "brando-word"
version = "0.1.0"
description = "Local Overleaf project to editable Word desktop converter"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "PySide6-Essentials==6.10.1",
    "python-docx==1.2.0",
    "tex2word[pdf,mathml]==1.2.0",
    "pylatexenc==2.10",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pyinstaller==6.17.0", "ruff==0.17.4"]
evaluation = ["pypandoc_binary==1.17"]

[project.gui-scripts]
brando = "brando.gui:main"

[project.scripts]
brando-convert = "brando.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brando = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E501", "E7", "E9", "F", "I"]
